name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Unit tests (79 tests, 10 suites)
        run: |
          xcodebuild -project Switchcraft.xcodeproj -scheme Switchcraft -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO test | tail -40
          exit ${PIPESTATUS[0]}
